<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>价格监控台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{.BasePath}}/static/style.css" />
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <main class="container">
    <header class="hero card">
      <div class="hero-head">
        <p class="tag">PRICE RADAR</p>
        <h1>价格监控台</h1>
        <p class="sub">追踪摄影器材水货报价变化，自动入库，快速发现低价窗口。</p>
      </div>
      <div class="hero-controls">
        <div class="hero-status">
          <div class="hero-status-grid">
            <div class="hero-chip">
              <p class="hero-chip-label">最后更新时间</p>
              <p class="hero-chip-main" id="statLastUpdate">-</p>
            </div>
            <div class="hero-chip">
              <p class="hero-chip-label">今日汇率 HKD/CNY</p>
              <p class="hero-chip-main" id="statFxRate">-</p>
            </div>
            <div class="hero-chip">
              <p class="hero-chip-label">今日更新</p>
              <p class="hero-chip-main" id="statUpdatedToday">0 件</p>
            </div>
            <div id="heroCollectChip" class="hero-chip hero-chip-state idle">
              <p class="hero-chip-label">采集状态</p>
              <p class="hero-chip-main" id="heroCollectState">空闲</p>
              <p class="hero-chip-sub" id="heroCollectDetail">线程 0 · 待补抓 0</p>
            </div>
          </div>
        </div>
        <div class="hero-actions">
          <button id="addProductBtn" class="btn-link">新增采集项</button>
          <button id="refreshBtn" class="btn-link">刷新数据</button>
          <button id="collectBtn" class="btn-primary">立即采集</button>
        </div>
        <div class="hero-nav-links">
          <a class="btn-link" href="{{.BasePath}}/runtime">采集监控</a>
          <a class="btn-link" href="{{.BasePath}}/fx">汇率查看</a>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="section-head">
        <h2>商品台账</h2>
        <span id="countBadge" class="badge">0 件商品</span>
      </div>
      <div class="filters-row">
        <select id="filterProductName" class="ui-field">
          <option value="">全部商品</option>
        </select>
        <select id="filterStore" class="ui-field">
          <option value="">全部店铺</option>
        </select>
        <button id="clearFiltersBtn" class="btn-link">清空筛选</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>商品</th>
              <th>店铺</th>
              <th>最新价格</th>
              <th>手续费(1%)</th>
              <th>采集状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="uiModal" class="ui-modal" aria-hidden="true">
    <div class="ui-modal-backdrop"></div>
    <div class="ui-modal-panel card">
      <h3 id="uiModalTitle" class="ui-modal-title"></h3>
      <p id="uiModalMessage" class="ui-modal-message"></p>
      <div id="uiModalBody" class="ui-modal-body"></div>
      <div class="ui-modal-actions">
        <button id="uiModalCancel" class="btn-link">取消</button>
        <button id="uiModalConfirm" class="btn-primary">确定</button>
      </div>
    </div>
  </div>

  <div id="uiToast" class="ui-toast" aria-hidden="true"></div>

  <script>
    const BASE_PATH = '{{.BasePath}}';
    function withBase(path) {
      return `${BASE_PATH}${path}`;
    }

    function formatYMD(input) {
      if (!input) return '-';
      const s = String(input);
      const m = s.match(/\d{4}-\d{2}-\d{2}/);
      if (m) return m[0];
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) return s;
      return d.toISOString().slice(0, 10);
    }

    function formatDateTimeCN(input) {
      if (!input) return '-';
      const s = String(input).replace('T', ' ').replace('Z', '');
      const m = s.match(/\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}/);
      if (m) return m[0];
      const d = new Date(input);
      if (Number.isNaN(d.getTime())) return s;
      return new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        hour12: false,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      }).format(d).replace(/\//g, '-');
    }

    function escapeHTML(input) {
      return String(input ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function trendMeta(latest, prev) {
      if (!Number.isFinite(latest) || !Number.isFinite(prev)) {
        return { icon: '•', cls: 'flat', title: '无前日数据' };
      }
      const diff = latest - prev;
      if (Math.abs(diff) < 0.005) return { icon: '→', cls: 'flat', title: '较前日持平' };
      if (diff > 0) return { icon: '↑', cls: 'up', title: '较前日上涨' };
      return { icon: '↓', cls: 'down', title: '较前日下降' };
    }

    function isOutOfStockErrorText(errText) {
      if (!errText) return false;
      const text = String(errText);
      const keywords = [
        '无货', '無貨', '缺货', '缺貨', '售罄',
        '請先查詢', '请先查询', '請查詢', '请查询',
        '查詢中', '查询中', '待查詢', '待查询',
        '預訂', '预订', '離線', '离线'
      ];
      return keywords.some((kw) => text.includes(kw));
    }

    function epochDayFromYMD(ymd) {
      const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      const y = Number(m[1]);
      const mon = Number(m[2]);
      const d = Number(m[3]);
      return Math.floor(Date.UTC(y, mon - 1, d) / 86400000);
    }

    function staleAgeDays(priceYMD, todayYMD) {
      const p = epochDayFromYMD(priceYMD);
      const t = epochDayFromYMD(todayYMD);
      if (p == null || t == null) return null;
      return t - p;
    }

    function extractYMD(text) {
      if (!text) return '';
      const m = String(text).match(/\d{4}-\d{2}-\d{2}/);
      return m ? m[0] : '';
    }

    function staleAgeLabel(ageDays) {
      if (ageDays === 1) return '昨日';
      if (ageDays >= 2) return `${ageDays}天前`;
      return '非今日';
    }

    function staleLevelClass(ageDays) {
      if (ageDays >= 4) return 'lv-3';
      if (ageDays >= 2) return 'lv-2';
      return 'lv-1';
    }

    const modalEl = document.getElementById('uiModal');
    const modalTitleEl = document.getElementById('uiModalTitle');
    const modalMessageEl = document.getElementById('uiModalMessage');
    const modalBodyEl = document.getElementById('uiModalBody');
    const modalCancelEl = document.getElementById('uiModalCancel');
    const modalConfirmEl = document.getElementById('uiModalConfirm');
    const toastEl = document.getElementById('uiToast');
    const filterProductNameEl = document.getElementById('filterProductName');
    const filterStoreEl = document.getElementById('filterStore');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');

    let modalResolve = null;
    let allProducts = [];
    let currentFxRate = null;
    let heroCollectTimer = null;
    const heroCollectStateEl = document.getElementById('heroCollectState');
    const heroCollectDetailEl = document.getElementById('heroCollectDetail');
    const heroCollectChipEl = document.getElementById('heroCollectChip');

    function renderHeroCollectStatus(st) {
      const running = !!st.collect_running;
      heroCollectStateEl.textContent = running ? '采集中' : '空闲';
      heroCollectStateEl.classList.toggle('up', running);
      heroCollectStateEl.classList.toggle('flat', !running);
      heroCollectDetailEl.textContent = `线程 ${st.active_workers || 0} · 待补抓 ${st.pending_retry || 0}`;
      heroCollectChipEl.classList.toggle('running', running);
      heroCollectChipEl.classList.toggle('idle', !running);
    }

    async function loadHeroCollectStatus() {
      const res = await fetch(withBase('/api/runtime/status'));
      if (!res.ok) throw new Error(await res.text());
      const st = await res.json();
      renderHeroCollectStatus(st);
    }

    function startHeroCollectPoll() {
      if (heroCollectTimer) clearInterval(heroCollectTimer);
      heroCollectTimer = setInterval(() => {
        loadHeroCollectStatus().catch(() => {});
      }, 1800);
    }

    function showToast(message, kind = 'info') {
      toastEl.textContent = message;
      toastEl.classList.remove('show', 'ok', 'error');
      if (kind === 'ok') toastEl.classList.add('ok');
      if (kind === 'error') toastEl.classList.add('error');
      toastEl.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2200);
    }

    function closeModal(payload) {
      modalEl.classList.remove('show');
      modalEl.setAttribute('aria-hidden', 'true');
      if (modalResolve) {
        modalResolve(payload);
        modalResolve = null;
      }
    }

    function populateStoreFilter(data) {
      const curr = filterStoreEl.value;
      const stores = Array.from(new Set(data.map(x => x.latest_store_name || x.store_name || '').filter(Boolean))).sort();
      filterStoreEl.innerHTML = ['<option value="">全部店铺</option>', ...stores.map(s => `<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`)].join('');
      if (stores.includes(curr)) {
        filterStoreEl.value = curr;
      }
    }

    function populateProductFilter(data) {
      const curr = filterProductNameEl.value;
      const products = Array.from(new Set(data.map(x => x.name || '').filter(Boolean))).sort();
      filterProductNameEl.innerHTML = ['<option value="">全部商品</option>', ...products.map(n => `<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`)].join('');
      if (products.includes(curr)) {
        filterProductNameEl.value = curr;
      }
    }

    function renderRows(data, fxRate) {
      const tbody = document.getElementById('rows');
      const today = todayYMDCN();
      tbody.innerHTML = data.map((p, idx) => {
        const latestPriceDate = formatYMD(p.latest_updated_at || p.latest_date);
        const merchantUpdateDate = extractYMD(p.merchant_update || '');
        const staleByCollect = p.latest_price != null && latestPriceDate && latestPriceDate !== today;
        const staleByMerchant = p.latest_price != null && merchantUpdateDate && merchantUpdateDate !== today;
        const isStalePrice = staleByCollect || staleByMerchant;
        const collectAge = staleAgeDays(latestPriceDate, today);
        const merchantAge = staleAgeDays(merchantUpdateDate, today);
        const staleAge = Math.max(
          staleByCollect && Number.isFinite(collectAge) ? collectAge : 0,
          staleByMerchant && Number.isFinite(merchantAge) ? merchantAge : 0
        );
        const staleCls = isStalePrice ? 'stale' : '';
        const staleTag = isStalePrice
          ? `<span class="freshness-badge ${staleLevelClass(staleAge)}" title="采集日期：${escapeHTML(latestPriceDate || '-')}；商户更新：${escapeHTML(merchantUpdateDate || '-')}">${escapeHTML(staleAgeLabel(staleAge))}</span>`
          : '';
        const staleMetaLines = [];
        staleMetaLines.push(`<div class="price-meta-date">采集日期 ${escapeHTML(latestPriceDate || '-')}</div>`);
        staleMetaLines.push(`<div class="price-meta-date">商户更新 ${escapeHTML(merchantUpdateDate || '-')}</div>`);
        const staleMeta = staleMetaLines.join('');
        const isOutOfStock = p.last_fetch_ok !== 1 && isOutOfStockErrorText(p.last_fetch_error);
        const fetchBadgeClass = p.last_fetch_ok === 1 ? 'ok' : (isOutOfStock ? 'oos' : 'fail');
        const fetchBadgeText = p.last_fetch_ok === 1 ? '成功' : (isOutOfStock ? '无货' : '失败');
        const fetchBadgeTitle = p.last_fetch_error ? ` title="${escapeHTML(p.last_fetch_error)}"` : '';
        const showReasonBtn = p.last_fetch_ok !== 1 && p.last_fetch_error;
        return `
        <tr style="animation-delay:${idx * 45}ms">
          <td data-label="ID"><span class="mono">#${p.id}</span></td>
          <td data-label="商品"><a href="${withBase(`/product/${p.id}`)}">${p.name}</a></td>
          <td data-label="店铺">${p.latest_store_name || p.store_name || '-'}</td>
          <td data-label="最新价格">${
            p.latest_price == null
              ? '-'
              : `
                <div class="price-stack">
                  <div class="price-cny">
                    <span class="price-value ${staleCls}">${(fxRate ? (p.latest_price * fxRate).toFixed(2) : '-')} CNY</span>
                    ${(() => {
                      const t = trendMeta(p.latest_price, p.prev_price);
                      return `<span class="trend-icon ${t.cls}" title="${t.title}">${t.icon}</span>`;
                    })()}
                    ${staleTag}
                  </div>
                  <div class="price-hkd"><span class="price-value ${staleCls}">${p.latest_price.toFixed(2)} ${p.currency}</span></div>
                  ${staleMeta}
                </div>
              `
          }</td>
          <td data-label="手续费(1%)">${
            p.latest_price == null
              ? '-'
              : `
                <div class="price-stack">
                  <div class="price-cny"><span class="price-value ${staleCls}">${(fxRate ? (p.latest_price * 0.01 * fxRate).toFixed(2) : '-')} CNY</span></div>
                  <div class="price-hkd"><span class="price-value ${staleCls}">${(p.latest_price * 0.01).toFixed(2)} ${p.currency}</span></div>
                </div>
              `
          }</td>
          <td data-label="采集状态">${
            p.last_fetch_ok == null
              ? '-'
              : `
                <div class="fetch-state">
                  ${
                    showReasonBtn
                      ? `<button class="fetch-badge ${fetchBadgeClass} js-fetch-reason" data-name="${escapeHTML(p.name)}" data-error="${escapeHTML(p.last_fetch_error)}"${fetchBadgeTitle}>${fetchBadgeText}</button>`
                      : `<span class="fetch-badge ${fetchBadgeClass}"${fetchBadgeTitle}>${fetchBadgeText}</span>`
                  }
                  <span class="muted-mini">${p.last_fetch_at ? formatDateTimeCN(p.last_fetch_at) : '-'}</span>
                </div>
              `
          }</td>
          <td data-label="操作">
            <div class="op-actions">
              <a class="btn-mini btn-open" href="${p.url}" target="_blank" rel="noreferrer">打开</a>
              <button class="btn-mini btn-danger js-delete" data-id="${p.id}" data-name="${escapeHTML(p.name)}">删除</button>
            </div>
          </td>
        </tr>
      `;
      }).join('');

      document.querySelectorAll('.js-delete').forEach((el) => {
        el.addEventListener('click', async () => {
          try {
            await deleteProduct(el.dataset.id, el.dataset.name || '');
            await loadProducts();
          } catch (e) {
            showToast('删除失败: ' + e.message, 'error');
          }
        });
      });

      document.querySelectorAll('.js-fetch-reason').forEach((el) => {
        el.addEventListener('click', async () => {
          await openModal({
            title: `${el.dataset.name || '采集项'} 失败原因`,
            message: el.dataset.error || '无详细错误信息',
            confirmText: '我知道了',
            hideCancel: true,
          });
        });
      });
    }

    function applyFilters() {
      const productName = (filterProductNameEl.value || '').trim();
      const store = (filterStoreEl.value || '').trim();
      const filtered = allProducts.filter((p) => {
        const n = String(p.name || '');
        const s = String(p.latest_store_name || p.store_name || '');
        if (store && s !== store) return false;
        if (productName && n !== productName) return false;
        return true;
      });
      if (allProducts.length === filtered.length) {
        document.getElementById('countBadge').textContent = `${allProducts.length} 件商品`;
      } else {
        document.getElementById('countBadge').textContent = `${filtered.length}/${allProducts.length} 件商品`;
      }
      renderRows(filtered, currentFxRate);
    }

    function openModal({ title, message = '', bodyHTML = '', confirmText = '确定', cancelText = '取消', danger = false, hideCancel = false }) {
      modalTitleEl.textContent = title || '';
      modalMessageEl.textContent = message || '';
      modalBodyEl.innerHTML = bodyHTML || '';
      modalConfirmEl.textContent = confirmText;
      modalCancelEl.textContent = cancelText;
      modalCancelEl.style.display = hideCancel ? 'none' : '';
      modalConfirmEl.classList.toggle('btn-danger', !!danger);
      modalEl.classList.add('show');
      modalEl.setAttribute('aria-hidden', 'false');
      return new Promise((resolve) => {
        modalResolve = resolve;
      });
    }

    modalCancelEl.addEventListener('click', () => closeModal({ ok: false }));
    modalConfirmEl.addEventListener('click', () => closeModal({ ok: true }));
    modalEl.querySelector('.ui-modal-backdrop').addEventListener('click', () => closeModal({ ok: false }));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalEl.classList.contains('show')) {
        closeModal({ ok: false });
      }
    });

    function normalizeStoreName(input) {
      return String(input || '').trim().replace(/\s+/g, ' ');
    }

    function buildStoreOptionsHTML(stores) {
      return stores.map((s) => `<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join('');
    }

    async function fetchStoreOptions() {
      const res = await fetch(withBase('/api/store-options'));
      if (!res.ok) throw new Error(await res.text());
      const out = await res.json();
      const stores = Array.isArray(out.stores) ? out.stores : [];
      return stores.map(normalizeStoreName).filter(Boolean);
    }

    async function addProduct() {
      let stores = [];
      try {
        stores = await fetchStoreOptions();
      } catch (e) {
        stores = ['Galaxy 銀河攝影器材', '順星數碼'];
      }
      if (!stores.length) {
        stores = ['Galaxy 銀河攝影器材', '順星數碼'];
      }

      const modalPromise = openModal({
        title: '新增采集项',
        message: '可从下拉框选择店铺，也可输入新店铺后加入列表；下拉中的店铺支持删除。',
        bodyHTML: `
          <label class="ui-field-label">商品链接</label>
          <input id="modalUrl" class="ui-field" placeholder="https://www.price.com.hk/product.php?p=xxxx" />
          <label class="ui-field-label">店铺（下拉选择）</label>
          <select id="modalStoreSelect" class="ui-field">
            ${buildStoreOptionsHTML(stores)}
          </select>
          <div class="modal-store-row">
            <input id="modalStoreNew" class="ui-field" placeholder="输入新店铺名，如：XX 数码" />
            <button id="modalStoreAddBtn" type="button" class="btn-mini">新增店铺</button>
            <button id="modalStoreDeleteBtn" type="button" class="btn-mini">删除选中</button>
          </div>
        `,
        confirmText: '新增',
      });

      const storeSelectEl = document.getElementById('modalStoreSelect');
      const storeNewEl = document.getElementById('modalStoreNew');
      const storeAddBtn = document.getElementById('modalStoreAddBtn');
      const storeDeleteBtn = document.getElementById('modalStoreDeleteBtn');
      let deleteConfirmTarget = '';
      let deleteConfirmTimer = null;
      const resetDeleteConfirm = () => {
        deleteConfirmTarget = '';
        storeDeleteBtn.textContent = '删除选中';
        if (deleteConfirmTimer) {
          clearTimeout(deleteConfirmTimer);
          deleteConfirmTimer = null;
        }
      };
      const refreshStoreSelect = async (prefer = '') => {
        stores = await fetchStoreOptions();
        if (!stores.length) stores = ['Galaxy 銀河攝影器材', '順星數碼'];
        storeSelectEl.innerHTML = buildStoreOptionsHTML(stores);
        const target = normalizeStoreName(prefer);
        if (target && stores.includes(target)) {
          storeSelectEl.value = target;
        }
        resetDeleteConfirm();
      };

      storeAddBtn.addEventListener('click', async () => {
        const name = normalizeStoreName(storeNewEl.value);
        if (!name) {
          showToast('请输入店铺名称', 'error');
          return;
        }
        const res = await fetch(withBase('/api/store-options'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        if (!res.ok) {
          showToast('新增店铺失败: ' + await res.text(), 'error');
          return;
        }
        await refreshStoreSelect(name);
        storeNewEl.value = '';
        showToast('店铺已加入下拉列表', 'ok');
      });

      storeDeleteBtn.addEventListener('click', async () => {
        const target = normalizeStoreName(storeSelectEl.value);
        if (!target) {
          showToast('请先选择要删除的店铺', 'error');
          return;
        }
        if (deleteConfirmTarget !== target) {
          deleteConfirmTarget = target;
          storeDeleteBtn.textContent = `再次点击删除：${target}`;
          if (deleteConfirmTimer) clearTimeout(deleteConfirmTimer);
          deleteConfirmTimer = setTimeout(() => {
            resetDeleteConfirm();
          }, 4000);
          return;
        }
        const res = await fetch(withBase(`/api/store-options?name=${encodeURIComponent(target)}`), {
          method: 'DELETE',
        });
        if (!res.ok) {
          showToast('删除店铺失败: ' + await res.text(), 'error');
          resetDeleteConfirm();
          return;
        }
        await refreshStoreSelect();
        showToast('店铺已从下拉列表删除', 'ok');
      });

      const m = await modalPromise;
      if (!m.ok) return;

      const url = (document.getElementById('modalUrl')?.value || '').trim();
      const store = normalizeStoreName((storeNewEl?.value || '').trim() || (storeSelectEl?.value || 'Galaxy 銀河攝影器材'));

      if (!url) {
        showToast('链接不能为空', 'error');
        return;
      }
      if (!store) {
        showToast('店铺不能为空', 'error');
        return;
      }
      const normalizedURL = /^https?:\/\//i.test(url) ? url : `https://${url}`;

      const res = await fetch(withBase('/api/products'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: normalizedURL, store_name: store }),
      });
      if (!res.ok) {
        throw new Error(await res.text());
      }
      const out = await res.json();
      const actionText = out.dedup ? '已去重更新' : '新增成功';
      if (out.initial_collect === 'success') {
        showToast(`${actionText}：${out.name}（首次采集成功）`, 'ok');
      } else if (out.initial_collect === 'failed') {
        showToast(`${actionText}：${out.name}（首次采集失败）`, 'error');
      } else {
        showToast(`${actionText}：${out.name || ''}`, 'ok');
      }
    }

    async function deleteProduct(id, name) {
      const r1 = await openModal({
        title: '确认删除',
        message: `确认删除采集项「${name}」？此操作会删除该商品台账历史记录。`,
        confirmText: '确认删除',
        cancelText: '取消',
        danger: true,
      });
      if (!r1.ok) return;

      const res = await fetch(withBase(`/api/products/${id}`), {
        method: 'DELETE',
      });
      if (!res.ok) {
        throw new Error(await res.text());
      }
      showToast('删除成功', 'ok');
    }

    function todayYMDCN() {
      const parts = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());
      const y = parts.find(p => p.type === 'year')?.value;
      const m = parts.find(p => p.type === 'month')?.value;
      const d = parts.find(p => p.type === 'day')?.value;
      return `${y}-${m}-${d}`;
    }

    async function loadProducts() {
      const res = await fetch(withBase('/api/products'));
      const data = await res.json();
      allProducts = data;

      let fxRate = null;
      let fxDate = '';
      try {
        const fxRes = await fetch(withBase('/api/fx/hkd-cny/today'));
        if (fxRes.ok) {
          const fx = await fxRes.json();
          if (Number.isFinite(fx.rate) && fx.rate > 0) {
            fxRate = fx.rate;
            fxDate = formatYMD(fx.date || '');
          }
        }
      } catch (e) {}
      currentFxRate = fxRate;
      const fxText = fxRate
        ? `${fxRate.toFixed(4)}${fxDate ? `（${fxDate}）` : ''}`
        : '暂不可用';
      document.getElementById('statFxRate').textContent = fxText;
      populateProductFilter(allProducts);
      populateStoreFilter(allProducts);
      applyFilters();
      const today = todayYMDCN();
      const validLatest = data.filter(p => p.latest_price != null);
      const lastUpdated = validLatest
        .map(p => p.latest_updated_at || p.latest_date)
        .filter(Boolean)
        .sort();
      document.getElementById('statLastUpdate').textContent = lastUpdated.length
        ? formatDateTimeCN(lastUpdated[lastUpdated.length - 1])
        : '-';
      const updatedToday = validLatest.filter(p => formatYMD(p.latest_updated_at || p.latest_date) === today).length;
      document.getElementById('statUpdatedToday').textContent = `${updatedToday} 件`;
    }

    document.getElementById('collectBtn').addEventListener('click', async () => {
      const btn = document.getElementById('collectBtn');
      btn.disabled = true;
      btn.textContent = '采集中...';
      try {
        const res = await fetch(withBase('/api/collect'), { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        await loadProducts();
        showToast('采集完成', 'ok');
      } catch (e) {
        showToast('采集失败: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '立即采集';
        loadHeroCollectStatus().catch(() => {});
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '刷新中...';
      try {
        await loadProducts();
        showToast('刷新成功', 'ok');
      } catch (e) {
        showToast('刷新失败: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '刷新数据';
        loadHeroCollectStatus().catch(() => {});
      }
    });

    document.getElementById('addProductBtn').addEventListener('click', async () => {
      const btn = document.getElementById('addProductBtn');
      btn.disabled = true;
      btn.textContent = '新增中...';
      try {
        await addProduct();
        await loadProducts();
      } catch (e) {
        showToast('新增失败: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '新增采集项';
        loadHeroCollectStatus().catch(() => {});
      }
    });

    filterProductNameEl.addEventListener('change', () => applyFilters());
    filterStoreEl.addEventListener('change', () => applyFilters());
    clearFiltersBtn.addEventListener('click', () => {
      filterProductNameEl.value = '';
      filterStoreEl.value = '';
      applyFilters();
    });

    loadProducts();
    loadHeroCollectStatus().catch(() => {});
    startHeroCollectPoll();
  </script>
</body>
</html>
